name: Build Comic Box Fire TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract Android project from starter ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -jo Comic_Box_FireTV_Build_Starter.zip Comic_Box_FireTV_Project.zip -d .
          mkdir -p project
          unzip -q Comic_Box_FireTV_Project.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile the APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Save the APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Comic-Box-FireTV-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
